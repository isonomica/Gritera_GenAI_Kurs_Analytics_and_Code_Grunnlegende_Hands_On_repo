version: 2

models:
  - name: stg_order_items
    description: Staging-modell for ordrelinjer. Én rad per produkt per ordre.
    columns:
      - name: order_item_id
        description: Unik identifikator for ordrelinjen.
        tests:
          - unique
          - not_null
      - name: order_id
        description: Referanse til ordren ordrelinjen tilhører.
        tests:
          - not_null
      - name: product_id
        description: Referanse til produktet som ble bestilt.
        tests:
          - not_null
      - name: quantity
        description: Antall enheter bestilt av dette produktet.
        tests:
          - not_null
      - name: unit_price_nok
        description: Enhetspris i NOK på bestillingstidspunktet.
        tests:
          - not_null
      - name: line_total_nok
        description: Totalpris for linjen (quantity * unit_price_nok).
        tests:
          - not_null
